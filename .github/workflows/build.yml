name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Без секретів APK підписується debug-ключем: ставиться, але не оновлюється «поверх».
      - name: Ключ підпису
        env:
          KEYSTORE_BASE64: ${{ secrets.RADIOGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RADIOGUARD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет RADIOGUARD_KEYSTORE_BASE64 не задано. APK підписано debug-ключем."
          fi

      - name: Тести і lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Збірка APK
        env:
          RADIOGUARD_KEYSTORE_PASSWORD: ${{ secrets.RADIOGUARD_KEYSTORE_PASSWORD }}
          RADIOGUARD_KEY_ALIAS: ${{ secrets.RADIOGUARD_KEY_ALIAS }}
          RADIOGUARD_KEY_PASSWORD: ${{ secrets.RADIOGUARD_KEY_PASSWORD }}
          RADIOGUARD_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Перевірка, що немає дозволу INTERNET
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          permissions=$("$aapt2" dump permissions app/build/outputs/apk/release/app-release.apk)
          echo "$permissions"
          if echo "$permissions" | grep -q "android.permission.INTERNET"; then
            echo "::error::APK просить дозвіл INTERNET. Це заборонено."
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: radioguard-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
